  /* ---------- lightbox ---------- */
  function lbIds(sid, subId) {
    var s = getSection(sid);
    if (!s) return [];
    var u = subOf(s, subId);
    var list = u ? u.images : s.images;
    return list.filter(function (im) { return !!IMG.get(im.id); }).map(function (im) { return im.id; });
  }
  function openLightbox(sid, iid, subId) {
    var s0 = getSection(sid);
    var loc0 = locateImg(sid, iid);
    var ids = lbIds(sid, subId || (loc0 && loc0.sub ? loc0.sub.id : ''));
    if (!ids.length && s0) ids = lbIds(sid, '');
    if (!ids.length) return;
    var idx = ids.indexOf(iid);
    lbState = { sid: sid, subId: subId || '', ids: ids, idx: idx < 0 ? 0 : idx };
    paintLightbox();
    var lb = $('#lightbox');
    lb.hidden = false;
    document.body.classList.add('lb-open');
  }
  function paintLightbox() {
    var s = getSection(lbState.sid);
    if (!s) return;
    var id = lbState.ids[lbState.idx];
    var loc = locateImg(lbState.sid, id);
    var im = (loc && loc.im) || {};
    var data = IMG.get(id);
    var img = $('#lbImg');
    if (data) img.src = data;
    img.alt = s.title;
    var u = loc && loc.sub;
    var sIdx = doc.sections.indexOf(s);
    $('#lbTitle').textContent = u
      ? ((sIdx + 1) + '.' + (s.subs.indexOf(u) + 1) + ' ' + (u.title || s.title))
      : s.title;
    $('#lbCap').textContent = im.tag || '';
    $('#lbCount').textContent = pad(lbState.idx + 1) + ' / ' + pad(lbState.ids.length);
    var multi = lbState.ids.length > 1;
    $$('.lb-nav').forEach(function (b) { b.hidden = !multi; });
  }
  function lbStep(d) {
    if (!lbState.ids.length) return;
    lbState.idx = (lbState.idx + d + lbState.ids.length) % lbState.ids.length;
    paintLightbox();
  }
  function closeLightbox() {
    var lb = $('#lightbox');
    if (lb) lb.hidden = true;
    document.body.classList.remove('lb-open');
  }
  function lightboxOpen() {
    var lb = $('#lightbox');
    return lb && !lb.hidden;
  }

  var lbTouchX = null;
  (function bindLightbox() {
    var lb = $('#lightbox');
    if (!lb) return;
    lb.addEventListener('touchstart', function (e) {
      lbTouchX = e.touches[0].clientX;
    }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      if (lbTouchX === null) return;
      var dx = e.changedTouches[0].clientX - lbTouchX;
      lbTouchX = null;
      if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  document.addEventListener('click', function (e) {
    if (e.target.id === 'outlineMask') closeOutline();
  });
  document.addEventListener('keydown', function (e) {
    var meta = e.metaKey || e.ctrlKey;
    var tag = (e.target && e.target.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
    if (meta && !typing && !READONLY && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();

    if (!lightboxOpen()) return;

  /* ---------- observers ---------- */
  var revealIO = null;
  function observeReveal() {
    if (!('IntersectionObserver' in window)) { $$('.reveal').forEach(function (e) { e.classList.add('in'); }); return; }
    if (!revealIO) {
      revealIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('in'); revealIO.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
    }
    $$('.section.reveal:not(.in),.part-head.reveal:not(.in)').forEach(function (e) { revealIO.observe(e); });
  }

  var tocIO = null;
  function observeSections() {
    if (!('IntersectionObserver' in window)) return;
    if (tocIO) tocIO.disconnect();
    tocIO = new IntersectionObserver(function (entries) {
      var vis = entries.filter(function (e) { return e.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (vis[0]) setActiveToc(vis[0].target.dataset.sid);
    }, { rootMargin: '-16% 0px -70% 0px', threshold: 0 });
    $$('.section').forEach(function (s) { tocIO.observe(s); });
  }

  function gotoSection(sid) {
    var el = document.getElementById('sec-' + sid);
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.pageYOffset - (window.innerWidth > 1020 ? 74 : 104);
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    setActiveToc(sid);
    activeSection = sid;
  }

  /* ---------- images ---------- */
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, 1600 / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, cw, ch);
        var out = c.toDataURL('image/jpeg', 0.85);
        if (out.length > 900000) out = c.toDataURL('image/jpeg', 0.68);
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
      img.src = url;
    });
  }

  function subOf(s, subId) {
    if (!s || !subId || !Array.isArray(s.subs)) return null;
    return s.subs.filter(function (u) { return u.id === subId; })[0] || null;
  }

  function locateImg(sid, iid) {
    var s = getSection(sid);
    if (!s) return null;
    var i = s.images.findIndex(function (x) { return x.id === iid; });
    if (i >= 0) return { sec: s, sub: null, list: s.images, idx: i, im: s.images[i] };
    var subs = Array.isArray(s.subs) ? s.subs : [];
    for (var k = 0; k < subs.length; k++) {
      var j = subs[k].images.findIndex(function (x) { return x.id === iid; });
      if (j >= 0) return { sec: s, sub: subs[k], list: subs[k].images, idx: j, im: subs[k].images[j] };
    }
    return null;
  }

  function secImgCount(s) {
    var subs = Array.isArray(s.subs) ? s.subs : [];
    return s.images.length + subs.reduce(function (a, u) { return a + u.images.length; }, 0);
  }

  function addFiles(sid, subId, files) {
    var s = getSection(sid);
    if (!s || !files || !files.length) return Promise.resolve();
    var target = subId ? subOf(s, subId) : null;
    var list = target ? target.images : s.images;
    if (!list) return Promise.resolve();
    toast('正在处理 ' + files.length + ' 张图片…');
    var chain = Promise.resolve();
    var okCount = 0;
    files.forEach(function (f) {
      chain = chain.then(function () {
        return compress(f).then(function (data) {
          var im = { id: uid('img'), tag: '', caption: '', st: {} };
          IMG.set(im.id, data);
          list.push(im);
          okCount++;
          return dbPut('img', im.id, data).catch(function () { });
        }).catch(function () { });
      });
    });
    return chain.then(function () {
      save();
      renderSection(sid);
      toast(okCount ? ('已添加 ' + okCount + ' 张图片') : '图片处理失败，请换一张试试');
    });
  }

  function replaceImage(sid, iid, file) {
    if (!locateImg(sid, iid)) return;
    compress(file).then(function (data) {
      IMG.set(iid, data);
      return dbPut('img', iid, data).catch(function () { });
    }).then(function () {
      save(); renderSection(sid); toast('已替换');
    }).catch(function () { toast('替换失败'); });
  }

  function deleteImage(sid, iid) {
    var loc = locateImg(sid, iid);
    if (!loc) return;
    loc.list.splice(loc.idx, 1);
    /* 图片数据先留在本地，撤回时可原样恢复 */
    save(); renderSection(sid); renderToc();
  }

  function moveImage(sid, iid, dir) {
    var loc = locateImg(sid, iid);
    if (!loc) return;
    var i = loc.idx, j = i + dir;
    if (j < 0 || j >= loc.list.length) return;
    var tmp = loc.list[i]; loc.list[i] = loc.list[j]; loc.list[j] = tmp;
    save(); renderSection(sid);
  }

  function openPicker(sid, subId, iid) {
    if (READONLY || !editing) return;
    pickTarget = { sid: sid, sub: subId || '', iid: iid || null };
    var p = $('#filePicker');
    p.value = '';
    p.click();
  }

  $('#filePicker').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length || !pickTarget) return;
    var t = pickTarget; pickTarget = null;
    if (t.iid) replaceImage(t.sid, t.iid, files[0]);
    else addFiles(t.sid, t.sub, files);
  });

  $('#jsonPicker').addEventListener('change', function (e) {
    var f = (e.target.files || [])[0];
    if (f) importBackup(f);
    e.target.value = '';
  });

  /* ---------- modal ---------- */
  function closeModal() {
    var m = $('.modal-mask');
    if (m) m.remove();
    modalOpen = false;
  }
  function openModal(opt) {
    closeModal();
    modalOpen = true;
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(opt.title || '') + '</h3>' +
      (opt.desc ? '<p>' + opt.desc + '</p>' : '') +
      (opt.fields || []).map(function (f) {
        var val = esc(f.value || '');
        var ph = esc(f.placeholder || '');
        return '<div class="field"><label>' + esc(f.label || '') + '</label>' +
          (f.type === 'textarea'
            ? '<textarea rows="' + (f.rows || 3) + '" data-k="' + f.key + '" placeholder="' + ph + '">' + val + '</textarea>'
            : '<input data-k="' + f.key + '" type="' + (f.type || 'text') + '" value="' + val + '" placeholder="' + ph + '">') +
          '</div>';
      }).join('') +
      '<div class="modal-actions">' +
        '<button class="btn" data-m="cancel">' + esc(opt.cancelText || '取消') + '</button>' +
        '<button class="btn primary" data-m="ok">' + esc(opt.okText || '确定') + '</button>' +
      '</div></div>';
    document.body.appendChild(mask);

    function done() { mask.remove(); modalOpen = false; }

    mask.addEventListener('click', function (ev) {
      if (ev.target === mask) { done(); return; }
      var btn = ev.target.closest('[data-m]');
      if (!btn) return;
      if (btn.dataset.m === 'cancel') { done(); return; }
      var vals = {};
      $$('[data-k]', mask).forEach(function (el) { vals[el.dataset.k] = el.value.trim(); });
      var ret = opt.onOk ? opt.onOk(vals) : null;
      if (ret && typeof ret.then === 'function') {
        btn.disabled = true;
        ret.then(function (r) { btn.disabled = false; if (r !== false) done(); },
                 function () { btn.disabled = false; });
      } else if (ret !== false) {
        done();
      }
    });
    mask.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { done(); return; }
      if (ev.key === 'Enter' && !ev.shiftKey && ev.target.tagName !== 'TEXTAREA') {
        ev.preventDefault();
        var ok = mask.querySelector('[data-m="ok"]');
        if (ok) ok.click();
      }
    });
    var first = mask.querySelector('input,textarea');
    if (first) setTimeout(function () { first.focus(); first.select && first.select(); }, 70);
    return mask;
  }

  /* ---------- section ops ---------- */
  function addSection() {
    openModal({
      title: '新建板块',
      desc: '新板块会自动出现在目录和页面中，之后可随时改名或调整顺序。',
      fields: [
        { key: 'partTitle', label: '大标题（可留空，一、二、三…自动编号）', placeholder: '例如：整体风格趋势' },
        { key: 'partSub', label: '大标题说明（可留空）', placeholder: '一句话概括这一章，可留空' },
        { key: 'title', label: '板块标题', placeholder: '例如：秋冬新款' },
        { key: 'subtitle', label: '小标题（可留空）', placeholder: '例如：核心花型方向' },
        { key: 'desc', label: '一句话说明（可留空）', type: 'textarea', rows: 2 }
      ],
      okText: '创建',
      onOk: function (v) {
        if (!v.title) { toast('请填写板块标题'); return false; }
        var idx = doc.sections.length;
        var s = {
          id: uid('sec'), title: v.title, subtitle: v.subtitle || '', desc: v.desc, hl: '',
          partTitle: v.partTitle || '', partSub: v.partSub || '',
          color: themeAt(idx),
          perRow: 5, st: {},
          images: [], subs: []
        };
        doc.sections.push(s);
        save(); render();
        setTimeout(function () { gotoSection(s.id); }, 90);
      }
    });
  }

  function renameSection(sid) {
    var s = doc.sections.filter(function (x) { return x.id === sid; })[0];
    if (!s) return;
    openModal({
      title: '编辑板块',
      desc: '修改后会同时更新目录与页面标题。',
      fields: [
        { key: 'partTitle', label: '大标题（可留空，一、二、三…自动编号）', value: s.partTitle || '' },
        { key: 'partSub', label: '大标题说明（可留空）', value: s.partSub || '' },
        { key: 'title', label: '板块标题', value: s.title },
        { key: 'subtitle', label: '小标题（可留空）', value: s.subtitle || '' },
        { key: 'desc', label: '一句话说明（可留空）', type: 'textarea', rows: 2, value: s.desc || '' }
      ],
      okText: '保存',
      onOk: function (v) {
        if (!v.title) { toast('标题不能为空'); return false; }
        s.title = v.title; s.subtitle = v.subtitle || ''; s.desc = v.desc;
        s.partTitle = v.partTitle || ''; s.partSub = v.partSub || '';
        save(); render();
      }
    });
  }

  function moveSection(sid, dir) {
    var i = doc.sections.findIndex(function (x) { return x.id === sid; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= doc.sections.length) return;
    var tmp = doc.sections[i]; doc.sections[i] = doc.sections[j]; doc.sections[j] = tmp;
    save(); render();
  }

  function deleteSection(sid) {
    var s = doc.sections.filter(function (x) { return x.id === sid; })[0];
    if (!s) return;
    openModal({
      title: '删除板块？',
      desc: '「' + esc(s.title) + '」及其中 ' + secImgCount(s) + ' 张图片' + ((s.subs || []).length ? ('、' + s.subs.length + ' 个分支') : '') + ' 会一并删除，操作不可撤销。',
      okText: '确认删除',
      onOk: function () {
        doc.sections = doc.sections.filter(function (x) { return x.id !== sid; });
        save(); render(); toast('已删除板块');
      }
    });
  }

  /* ---------- edit mode ---------- */
  function enterEdit() {
    editing = true;
    render();
    toast('编辑模式已开启：点击板块内任意位置后按 Ctrl / ⌘ + V 粘贴图片');
  }

  function toggleEdit() {
    if (READONLY) return;
    if (editing) {
      editing = false; activeSection = null;
      hideFmtBar();
      save(); render(); toast('已退出编辑模式');
      return;
    }
    dbGet('kv', 'auth').then(function (auth) {
      if (!auth || !auth.hash) {
        openModal({
          title: '设置编辑密码',
          desc: '这是第一次进入编辑模式。请设置一个只有你知道的密码，之后进入编辑都需要它。<br><small>密码只保存在本浏览器，用于防止他人误改；协作分发请用「备份 / 导入」。</small>',
          fields: [
            { key: 'pw', label: '设置密码（至少 4 位）', type: 'password' },
            { key: 'pw2', label: '再输入一次', type: 'password' }
          ],
          okText: '确认并进入',
          onOk: function (v) {
            if ((v.pw || '').length < 4) { toast('密码至少 4 位'); return false; }
            if (v.pw !== v.pw2) { toast('两次输入不一致'); return false; }
            return hashPw(v.pw).then(function (h) {
              return dbPut('kv', 'auth', { hash: h, at: Date.now() });
            }).then(function () { enterEdit(); });
          }
        });
      } else {
        openModal({
          title: '输入编辑密码',
          desc: '编辑权限仅限制作人。',
          fields: [{ key: 'pw', label: '密码', type: 'password' }],
          okText: '进入编辑',
          onOk: function (v) {
            return hashPw(v.pw || '').then(function (h) {
              if (h !== auth.hash) { toast('密码不正确'); return false; }
              enterEdit();
            });
          }
        });
      }
    });
  }

  /* ---------- 主题配色 ---------- */
  function applyThemeColors(mode) {
    var n = doc.sections.length;
    var base = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#B75E70';
    doc.sections.forEach(function (s, i) {
      if (mode === 'unified') s.color = base;
      else if (mode === 'mono') s.color = monoAt(base, i, n);
      else s.color = themeAt(i);
    });
    save(); render();
    toast(mode === 'unified' ? '已统一为主题主色' : (mode === 'mono' ? '已改为同色系阶梯' : '已按主题色序重新分配'));
  }

  function openThemeColors() {
    if (READONLY || !editing) { toast('请先进入编辑模式'); return; }
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>主题配色</h3>' +
      '<p>把全站栏目颜色对齐到主题色系，避免出现与整体调性不合的颜色。选择一种方式后立即生效，可用「撤回」还原。</p>' +
      '<div class="theme-opts">' +
        '<button class="theme-opt" data-tm="cycle">' +
          '<span class="tm-name">顺序轮转</span>' +
          '<span class="tm-desc">按主题色序依次分配，相邻栏目不撞色</span>' +
          '<span class="tm-bars">' + THEME_SEQ.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') + '</span>' +
        '</button>' +
        '<button class="theme-opt" data-tm="mono">' +
          '<span class="tm-name">同色系阶梯</span>' +
          '<span class="tm-desc">都以主题主色为基准，靠深浅区分</span>' +
          '<span class="tm-bars">' + [0,1,2,3,4,5,6,7].map(function (i) { return '<i style="background:' + monoAt('#B75E70', i, 8) + '"></i>'; }).join('') + '</span>' +
        '</button>' +
        '<button class="theme-opt" data-tm="unified">' +
          '<span class="tm-name">全站统一</span>' +
          '<span class="tm-desc">所有栏目同一个主题色，最克制</span>' +
          '<span class="tm-bars"><i style="background:#B75E70;flex:1"></i></span>' +
        '</button>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn" data-m="cancel">取消</button></div>' +
      '</div>';
    document.body.appendChild(mask);
    function done() { mask.remove(); modalOpen = false; }
    modalOpen = true;
    mask.addEventListener('click', function (ev) {
      if (ev.target === mask) { done(); return; }

    });

  /* ---------- 修改编辑密码 ---------- */
  function changePassword() {
    if (READONLY) { toast('发布页不支持修改密码'); return; }
    dbGet('kv', 'auth').then(function (auth) {
      if (!auth || !auth.hash) {
        openModal({
          title: '还没有设置密码',
          desc: '请先退出编辑模式，再点「编辑」设置一个密码。',
          okText: '知道了'
        });
        return;
      }
      openModal({
        title: '修改编辑密码',
        desc: '先输入当前密码，再设置新密码。改完立即生效，旧密码作废。<br><small>密码只保存在本浏览器；换电脑或清理浏览器数据后需要重新设置。</small>',
        fields: [
          { key: 'old', label: '当前密码', type: 'password' },
          { key: 'pw', label: '新密码（至少 4 位）', type: 'password' },
          { key: 'pw2', label: '再输入一次新密码', type: 'password' }
        ],
        okText: '确认修改',
        onOk: function (v) {
          if (!v.old) { toast('请输入当前密码'); return false; }
          if ((v.pw || '').length < 4) { toast('新密码至少 4 位'); return false; }
          if (v.pw !== v.pw2) { toast('两次输入的新密码不一致'); return false; }
          if (v.pw === v.old) { toast('新密码不能和当前密码相同'); return false; }
          return hashPw(v.old).then(function (h) {
            if (h !== auth.hash) {
              toast('当前密码不正确');
              return false;
            }
            return hashPw(v.pw).then(function (nh) {
              return dbPut('kv', 'auth', { hash: nh, at: Date.now(), changedAt: Date.now() });
            }).then(function () {
              toast('密码已更新，下次进入编辑请用新密码');
              return true;
            });
          });
        }
      });
    });
  }

  /* ---------- export / import ---------- */
  function dateStamp() {
    var d = new Date();
    return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }
  function baseName() {
    return '女童裙装爆款画像' + dateStamp();
  }

  function download(name, content, type) {
    var blob = new Blob([content], { type: type + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }

  function snapshot(withImages) {
    var data = { v: 2, meta: JSON.parse(JSON.stringify(doc.meta)), sections: doc.sections.map(function (s) {
      return {
        id: s.id, title: s.title, subtitle: s.subtitle || '', desc: s.desc, hl: s.hl || '',
        partTitle: s.partTitle || '', partSub: s.partSub || '',
        color: colorOf(s), perRow: clampCols(s.perRow),
        st: s.st || {},
        images: s.images.map(function (im) {
          var o = { id: im.id, tag: im.tag || '', caption: im.caption || '', st: im.st || {} };
          if (withImages) o.data = IMG.get(im.id) || '';
          return o;
        }),
        subs: (Array.isArray(s.subs) ? s.subs : []).map(function (u) {
          return {
            id: u.id, title: u.title || '', note: u.note || '',
            perRow: clampCols(u.perRow), st: u.st || {},
            images: u.images.map(function (im) {
              var o = { id: im.id, tag: im.tag || '', caption: im.caption || '', st: im.st || {} };
              if (withImages) o.data = IMG.get(im.id) || '';
              return o;
            })
          };
        })
      };
    }) };
    return data;
  }

  function exportBackup() {
    var d = snapshot(true);
    d.meta.published = false;
    download(baseName() + '_备份.json',
      JSON.stringify(d, null, 2), 'application/json');
    toast('备份已下载（含图片）');
  }

  function exportPublish() {
    var seed = snapshot(true);
    seed.meta.published = true;
    var clone = document.documentElement.cloneNode(true);
    clone.setAttribute('data-published', '1');
    Array.prototype.forEach.call(clone.querySelectorAll('#seed-data'), function (n) { n.remove(); });
    var secWrap = clone.querySelector('#sections');
    if (secWrap) secWrap.innerHTML = '';
    var tocList = clone.querySelector('#tocList');
    if (tocList) tocList.innerHTML = '';
    var tr = clone.querySelector('#marqueeTrack');
    if (tr) tr.innerHTML = '';
    var ol = clone.querySelector('#outlineList');
    if (ol) ol.innerHTML = '';
    var olf = clone.querySelector('#outlineFoot');
    if (olf) olf.textContent = '';
    var tst = clone.querySelector('#toast');
    if (tst) { tst.textContent = ''; tst.className = 'toast'; }
    Array.prototype.forEach.call(clone.querySelectorAll('.modal-mask,.fmtbar'), function (n) { n.remove(); });
    var body = clone.querySelector('body');
    if (body) body.className = '';
    var et = clone.querySelector('#editorTools');
    if (et) et.setAttribute('hidden', '');
    var tt = clone.querySelector('#tocTools');
    if (tt) tt.setAttribute('hidden', '');
    var lb = clone.querySelector('#lightbox');
    if (lb) { lb.setAttribute('hidden', ''); }
    Array.prototype.forEach.call(clone.querySelectorAll('.grid-scroll'), function (n) {
      n.classList.remove('expanded');
    });

    var sc = document.createElement('script');
    sc.id = 'seed-data';
    sc.type = 'application/json';
    sc.textContent = JSON.stringify(seed).replace(/<\//g, '<\\/');
    (body || clone).appendChild(sc);

    download(baseName() + '.html', '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html');
    toast('已导出只读发布页 ' + baseName() + '.html');
  }

  function importBackup(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var d;
      try { d = JSON.parse(fr.result); } catch (e) { toast('文件格式不正确'); return; }
      if (!d || !Array.isArray(d.sections)) { toast('文件格式不正确'); return; }
      var jobs = [];
      var allLists = [];
      d.sections.forEach(function (s) {
        s.id = s.id || uid('sec');
        s.images = Array.isArray(s.images) ? s.images : [];
        allLists.push(s.images);
        s.subs = Array.isArray(s.subs) ? s.subs : [];
        s.subs.forEach(function (u) {
          u.id = u.id || uid('sub');
          u.images = Array.isArray(u.images) ? u.images : [];
          allLists.push(u.images);
        });
      });
      allLists.forEach(function (list) {
        list.forEach(function (im) {
          im.id = im.id || uid('img');
          if (im.data) {
            IMG.set(im.id, im.data);
            jobs.push(dbPut('img', im.id, im.data).catch(function () { }));
            delete im.data;
          }
        });
      });
      Promise.all(jobs).then(function () {
        var meta = defaultMeta();
        Object.keys(d.meta || {}).forEach(function (k) { meta[k] = d.meta[k]; });
        meta.published = false;
        doc = { v: 1, meta: meta, sections: d.sections };
        normalizeDoc();
        lastSnap = snapDoc();
        undoStack.length = 0;
        redoStack.length = 0;
        persistDoc();
        render(); paintHistoryUi(); toast('导入完成');
      });
    };
    fr.readAsText(file);
  }

  /* ---------- global actions ---------- */

        case 'sub-add': if (editing) addSub(sid, btn.dataset.sub || ''); return;
        case 'sub-add-after': if (editing) addSub(sid, '', btn.dataset.sub); return;
        case 'sub-del': if (editing) deleteSub(sid, btn.dataset.sub); return;

          if (gs) {

  /* ---------- paste ---------- */
  document.addEventListener('paste', function (e) {
    if (modalOpen) return;
    var cd = e.clipboardData;
    if (!cd) return;
    var files = [];
    if (cd.items) {
      for (var i = 0; i < cd.items.length; i++) {
        var it = cd.items[i];
        if (it.kind === 'file' && it.type.indexOf('image/') === 0) {
          var f = it.getAsFile();
          if (f) files.push(f);
        }
      }
    }
    if (!files.length && cd.files) {
      files = Array.prototype.slice.call(cd.files).filter(function (f) {
        return f.type.indexOf('image/') === 0;
      });
    }
    if (!files.length) return;
    if (!editing) { toast('先点右上角「编辑」，再粘贴图片'); return; }
    e.preventDefault();
    var g = activeGrid;
    var sid = (g && g.sid) || activeSection || (doc.sections[0] && doc.sections[0].id);
    if (!sid) { toast('请先新建一个板块'); return; }
    addFiles(sid, (g && g.sid === sid) ? (g.sub || '') : '', files);
  });

  /* ---------- drag & drop（图片文件上传） ---------- */
  document.addEventListener('dragover', function (e) {
    if (!editing) return;
    if (dragSort.active) return;
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }
  });
  document.addEventListener('drop', function (e) {
    if (!editing || dragSort.active) return;
    var files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || [])
      .filter(function (f) { return f.type.indexOf('image/') === 0; });
    if (!files.length) return;
    e.preventDefault();
    var wrap = e.target.closest('.grid-wrap');
    var sec = e.target.closest('.section');
    var sid = (wrap && wrap.dataset.sid) || (sec && sec.dataset.sid) || activeSection || (doc.sections[0] && doc.sections[0].id);
    if (!sid) { toast('请先新建一个板块'); return; }
    var sub = (wrap && wrap.dataset.sid === sid) ? (wrap.dataset.sub || '') : '';
    addFiles(sid, sub, files);
  });

  /* ---------- drag & drop（卡片拖拽排序） ---------- */
  var dragSort = { active: false, sid: null, iid: null, el: null };

  function clearDropMarks() {
    $$('.card.drop-before,.card.drop-after').forEach(function (c) {
      c.classList.remove('drop-before', 'drop-after');
    });
    $$('.grid.drop-zone').forEach(function (g) { g.classList.remove('drop-zone'); });
    $$('.grid-wrap.drop-zone').forEach(function (g) { g.classList.remove('drop-zone'); });
  }

  function resetDragSort() {
    var was = dragSort.active;
    clearDropMarks();
    if (dragSort.el) dragSort.el.classList.remove('dragging');
    document.body.classList.remove('dragging-sort');
    dragSort = { active: false, sid: null, iid: null, el: null };
    if (was) suppressClickUntil = Date.now() + 320;
  }

  function moveImageTo(srcSid, iid, targetSid, targetSub, targetIid, after) {
    var loc = locateImg(srcSid, iid);
    var dst = getSection(targetSid);
    if (!loc || !dst) return;
    var dstSub = subOf(dst, targetSub);
    var dstList = dstSub ? dstSub.images : dst.images;
    var srcList = loc.list;
    var from = srcList.findIndex(function (x) { return x.id === iid; });
    if (from < 0) return;
    var item = srcList.splice(from, 1)[0];
    if (!item) return;
    var to = dstList.length;
    if (targetIid) {
      var idx = dstList.findIndex(function (x) { return x.id === targetIid; });
      if (idx >= 0) to = after ? idx + 1 : idx;
    }
    dstList.splice(to, 0, item);
    save();
    if (srcSid !== targetSid) { renderSections(); renderToc(); }
    else renderSection(targetSid);
  }

  document.addEventListener('dragstart', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card || !editing || READONLY) return;
    if (e.target.closest('[contenteditable="true"]')) { e.preventDefault(); return; }
    dragSort = { active: true, sid: card.dataset.sid, sub: card.dataset.sub || '', iid: card.dataset.iid, el: card };
    card.classList.add('dragging');
    document.body.classList.add('dragging-sort');
    try {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.iid);
    } catch (err) { /* ignore */ }
  });

  document.addEventListener('dragover', function (e) {
    if (!dragSort.active) return;
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card) {
      if (card.dataset.iid === dragSort.iid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDropMarks();
      var r = card.getBoundingClientRect();
      var after = (e.clientX - r.left) > r.width / 2;
      card.classList.add(after ? 'drop-after' : 'drop-before');
      return;
    }
    var wrap = e.target.closest ? e.target.closest('.grid-wrap') : null;
    if (wrap) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDropMarks();
      wrap.classList.add('drop-zone');
    }
  });

  document.addEventListener('drop', function (e) {
    if (!dragSort.active) return;
    e.preventDefault();
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card && card.dataset.iid !== dragSort.iid) {
      var cls = card.classList.contains('drop-after') ? 'drop-after' : 'drop-before';
      var r = card.getBoundingClientRect();
      var after = cls === 'drop-after';
      if (!card.classList.contains('drop-before') && !card.classList.contains('drop-after')) {
        after = (e.clientX - r.left) > r.width / 2;
      }
      var srcSid = dragSort.sid, iid = dragSort.iid;
      var tSub = card.dataset.sub || '';
      resetDragSort();
      moveImageTo(srcSid, iid, card.dataset.sid, tSub, card.dataset.iid, after);
      toast('顺序已更新');
      return;
    }
    var wrap = e.target.closest ? e.target.closest('.grid-wrap') : null;
    if (wrap) {
      var srcSid2 = dragSort.sid, iid2 = dragSort.iid;
      resetDragSort();
      moveImageTo(srcSid2, iid2, wrap.dataset.sid, wrap.dataset.sub || '', null, true);
      toast('顺序已更新');
      return;
    }
    resetDragSort();
  });

  document.addEventListener('dragend', resetDragSort);

  /* ---------- pdf ---------- */
  function buildPrintHead() {
    var m = doc.meta || defaultMeta();
    var total = doc.sections.reduce(function (n, s) { return n + secImgCount(s); }, 0);
    var subTotal = doc.sections.reduce(function (n, s) { return n + ((s.subs || []).length); }, 0);
    var d = new Date();
    var ds = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    $('#phEyebrow').textContent = m.eyebrow || 'GIRLS DRESS TREND';
    $('#phTitle').textContent = m.title || '';
    $('#phSub').textContent = m.sub || '';
    $('#phMeta').textContent = '导出日期 ' + ds + ' ｜ 共 ' + doc.sections.length + ' 个板块' +
      (subTotal ? (' · ' + subTotal + ' 个分支') : '') + ' ｜ ' + total + ' 张图片';
  }

  function exportPDF() {
    if (READONLY) { toast('查看者无导出权限'); return; }
    if (!editing) { toast('请先进入编辑模式'); return; }
    dbGet('kv', 'auth').then(function (auth) {
      if (!auth || !auth.hash) { toast('仅页面拥有者可导出 PDF'); return; }
      buildPrintHead();
      var restored = [];
      $$('#sections img[data-img]').forEach(function (img) {
        img.loading = 'eager';
      });
      $$('.grid-scroll').forEach(function (el) {
        if (!el.classList.contains('expanded')) {
          el.classList.add('expanded');
          restored.push(el);
        }
      });
      document.body.classList.add('printing');
      closeLightbox();
      closeModal();
      var oldTitle = document.title;
      var d2 = new Date();
      document.title = baseName();
      toast('在打印窗口中选择「另存为 PDF」');
      var finished = false;
      function cleanup() {
        if (finished) return;
        finished = true;
        document.title = oldTitle;
        document.body.classList.remove('printing');
        restored.forEach(function (el) { el.classList.remove('expanded'); });
        requestAnimationFrame(updateOverflow);
      }
      window.addEventListener('afterprint', cleanup, { once: true });
      setTimeout(function () {
        try { window.print(); } catch (e) { toast('导出失败，请用浏览器打印功能'); }
        setTimeout(cleanup, 1200);
      }, 120);
    });
  }

  /* ---------- boot ---------- */
  function normalizeDoc() {
    if (!doc.sections) doc.sections = [];
    var meta = defaultMeta();
    Object.keys(doc.meta || {}).forEach(function (k) { meta[k] = doc.meta[k]; });
    /* 旧标题迁移：把之前保存的「童装印花组」相关文案统一换成新名称 */
    if (/童装印花组/.test(meta.title || '')) meta.title = '女童裙装爆款画像';
    if (/童装印花组|KIDSWEAR PRINT TREND/.test(meta.marquee || '')) {
      meta.marquee = String(meta.marquee)
        .replace(/童装印花组/g, '女童裙装爆款画像')
        .replace(/KIDSWEAR PRINT TREND/g, 'GIRLS DRESS TREND');
    }
    if (/KIDSWEAR PRINT TREND/.test(meta.eyebrow || '')) {
      meta.eyebrow = String(meta.eyebrow).replace(/KIDSWEAR PRINT TREND/g, 'GIRLS DRESS TREND');
    }
    meta.st = meta.st || {};
    doc.meta = meta;
    doc.sections.forEach(function (s, i) {
      s.id = s.id || uid('sec');
      if (!s.color) {
        s.color = themeAt(i);
      } else if (LEGACY_PALETTE.indexOf(String(s.color).toUpperCase()) >= 0) {
        s.color = PALETTE[LEGACY_PALETTE.indexOf(String(s.color).toUpperCase()) % PALETTE.length];
      }
      s.perRow = clampCols(s.perRow);
      s.hl = typeof s.hl === 'string' ? s.hl : '';
      s.subtitle = typeof s.subtitle === 'string' ? s.subtitle : '';
      s.partTitle = typeof s.partTitle === 'string' ? s.partTitle : '';
      s.partSub = typeof s.partSub === 'string' ? s.partSub : '';
      s.st = s.st || {};
      s.images = Array.isArray(s.images) ? s.images : [];
      s.images.forEach(function (im) {
        im.id = im.id || uid('img');
        im.st = im.st || {};
      });
      s.subs = Array.isArray(s.subs) ? s.subs : [];
      s.subs.forEach(function (u) {
        u.id = u.id || uid('sub');
        u.title = typeof u.title === 'string' ? u.title : '';
        u.note = typeof u.note === 'string' ? u.note : '';
        u.perRow = clampCols(u.perRow || 4);
        u.st = u.st || {};
        u.images = Array.isArray(u.images) ? u.images : [];
        u.images.forEach(function (im) {
          im.id = im.id || uid('img');
          im.st = im.st || {};
        });
      });
    });
  }

  function boot() {
    dbGet('kv', 'doc').then(function (stored) {
      var seed = null;
      var seedEl = document.getElementById('seed-data');
      if (seedEl) {
        try { seed = JSON.parse(seedEl.textContent); } catch (e) { seed = null; }
      }
      doc = READONLY ? (seed || stored || makeDefault()) : (stored || seed || makeDefault());
      normalizeDoc();

      var jobs = [];
      var allLists = [];
      doc.sections.forEach(function (s) {
        allLists.push(s.images);
        (s.subs || []).forEach(function (u) { allLists.push(u.images); });
      });
      allLists.forEach(function (list) {
        list.forEach(function (im) {
          if (im.data) {
            IMG.set(im.id, im.data);
            var d = im.data; delete im.data;
            if (!READONLY) jobs.push(dbPut('img', im.id, d).catch(function () { }));
          } else if (!READONLY) {
            jobs.push(dbGet('img', im.id).then(function (v) { if (v) IMG.set(im.id, v); }));
          }
        });
      });

      return Promise.all(jobs).then(function () {
        lastSnap = snapDoc();
        undoStack.length = 0;
        redoStack.length = 0;
        if (!stored && !READONLY) persistDoc();
        render();
        paintHistoryUi();
        setActiveToc(doc.sections[0] && doc.sections[0].id);
      });
    }).catch(function () {
      doc = makeDefault();
      normalizeDoc();
      render();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
